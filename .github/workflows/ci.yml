name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-pqc-and-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cryptography dependency
        run: python -m pip install --upgrade pip && pip install cryptography

      - name: Python syntax check
        run: |
          python -m py_compile \
            server.py \
            unified_runner.py \
            drone_simulator.py \
            vision_service.py \
            weather_integration.py \
            testbench/benchmark_crypto.py \
            testbench/inject_replay.py \
            testbench/inject_tamper.py

      - name: Run AEAD & PQC crypto benchmark
        run: python testbench/benchmark_crypto.py

      - name: Validate JSON and static web entrypoints
        run: |
          python -c "import json; json.load(open('manifest.json', encoding='utf-8'))"
          test -f index.html
          test -f phone_client.html
          test -f _worker.js
